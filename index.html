<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubba’s Heart Catch 🐻</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde8ed;--card:#fff;--ink:#4a1830;--rose:#e8577a;--gold:#c9812f;--line:rgba(232,87,122,.25);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2d0c1f;--card:#3b1229;--ink:#fef6f0;--gold:#f0b97d;--line:rgba(232,87,122,.35)}}
:root[data-theme="dark"]{--bg:#2d0c1f;--card:#3b1229;--ink:#fef6f0;--gold:#f0b97d;--line:rgba(232,87,122,.35)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Josefin Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none;user-select:none}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.4rem,5vw,2rem);margin:0;text-align:center}
h1 em{color:var(--rose)}
.hud{font-size:1rem;letter-spacing:.15em;color:var(--gold)}
.bar{width:min(440px,90vw);height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .3s}
.stage{position:relative;width:min(440px,94vw);height:min(62vh,560px);border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 20px 60px rgba(232,87,122,.2);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:color-mix(in srgb,var(--card) 92%,transparent);transition:opacity .5s}
.ov.hide{opacity:0;pointer-events:none}
.ov h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.4rem,5vw,1.9rem);margin:0;line-height:1.3}
.ov h2 em{color:var(--rose)}
.ov p{margin:0;font-weight:300;line-height:1.6;max-width:300px}
.big{font-size:3.2rem;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
button{font:inherit;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;border:0;border-radius:50px;padding:14px 30px;background:var(--rose);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(232,87,122,.4);transition:transform .2s}
button:hover{transform:scale(1.06)}
#no{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;position:relative}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:52px}
</style>
</head>
<body>
<h1>Catch my <em>love</em>, Bubba 🐻</h1>
<div class="hud" id="hud">💖 0 / 12</div>
<div class="bar"><i id="fill"></i></div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="start">
    <div class="big">🐻</div>
    <h2>Hey <em>Naja Parvin</em></h2>
    <p>Slide your bear to catch 12 falling hearts 💖 and dodge the broken ones 💔. A surprise is waiting at the end.</p>
    <button id="go">Start</button>
  </div>
  <div class="ov hide" id="ask">
    <div class="big">💍</div>
    <h2>Naja Parvin,<br>will you be my <em>Bubba</em> forever?</h2>
    <div class="row" id="row">
      <button id="yes">Yes 💖</button>
      <button id="no">No</button>
    </div>
    <p id="note"></p>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
let W=0,H=0,dpr=1;
function fit(){dpr=window.devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
fit();addEventListener('resize',fit);

const GOAL=12;
let bearX=W/2,score=0,running=false,items=[],conf=[],last=0,spawnT=0;

function move(e){const r=stage.getBoundingClientRect();const p=e.touches?e.touches[0]:e;bearX=Math.max(24,Math.min(W-24,p.clientX-r.left))}
stage.addEventListener('pointermove',move);
stage.addEventListener('touchmove',move,{passive:true});

function setScore(n){score=Math.max(0,n);document.getElementById('hud').textContent='💖 '+score+' / '+GOAL;document.getElementById('fill').style.width=Math.min(100,score/GOAL*100)+'%'}

function loop(t){
  const dt=Math.min(40,t-last||16);last=t;
  ctx.clearRect(0,0,W,H);
  if(running){
    spawnT+=dt;
    if(spawnT>650){spawnT=0;items.push({x:20+Math.random()*(W-40),y:-20,v:.1+Math.random()*.1+score*.006,bad:Math.random()<.22,s:26+Math.random()*8})}
    for(const it of items){it.y+=it.v*dt}
    items=items.filter(it=>{
      if(it.y>H-56&&it.y<H-10&&Math.abs(it.x-bearX)<38){setScore(score+(it.bad?-1:1));if(score>=GOAL)win();return false}
      return it.y<H+30;
    });
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){ctx.font=it.s+'px serif';ctx.fillText(it.bad?'💔':'💖',it.x,it.y)}
  ctx.font='46px serif';ctx.fillText('🐻',bearX,H-34);
  for(const c of conf){c.x+=c.vx;c.y+=c.vy;c.vy+=.12;c.life-=.008;ctx.globalAlpha=Math.max(0,c.life);ctx.font=c.s+'px serif';ctx.fillText(c.e,c.x,c.y)}
  ctx.globalAlpha=1;conf=conf.filter(c=>c.life>0);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('go').onclick=()=>{document.getElementById('start').classList.add('hide');items=[];setScore(0);running=true};

function win(){running=false;items=[];setTimeout(()=>document.getElementById('ask').classList.remove('hide'),500)}

function burst(){
  const em=['💖','🐻','✨','🌸','💕','🎉'];
  for(let i=0;i<110;i++)conf.push({x:W/2,y:H/2,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,s:16+Math.random()*20,e:em[i%em.length],life:1+Math.random()*.6});
}

const no=document.getElementById('no'),note=document.getElementById('note');
const lines=['Nice try, Bubba 😏','The button is shy 🙈','Too slow! 🐻','Just say yes 💕','You can’t catch me 😘'];
let li=0;
function dodge(){
  const a=document.getElementById('ask').getBoundingClientRect(),b=no.getBoundingClientRect();
  no.style.left=(Math.random()-.5)*Math.min(240,a.width-b.width-40)+'px';
  no.style.top=(Math.random()-.5)*160+'px';
  note.textContent=lines[li++%lines.length];
}
no.addEventListener('pointerenter',dodge);
no.addEventListener('pointerdown',e=>{e.preventDefault();dodge()});

document.getElementById('yes').onclick=()=>{
  document.getElementById('ask').innerHTML='<div class="big">🐻💖</div><h2>She said <em>yes!</em></h2><p>Naja Parvin, you just made me the happiest person alive. I love you, Bubba. Always. 💍</p>';
  document.getElementById('ask').style.background='transparent';
  burst();setInterval(burst,1800);
};
</script>
</body>
</html>
